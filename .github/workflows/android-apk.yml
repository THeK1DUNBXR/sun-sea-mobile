name: Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Backend API base URL baked into the build (can be changed later in the app's Settings)"
        required: false
        default: "http://192.168.1.10:5000/api"
  push:
    branches: ["**"]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: ${{ github.event.inputs.api_url || vars.MOBILE_API_URL || 'http://192.168.1.10:5000/api' }}
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.1.12297006 cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck & unit tests
        run: |
          npm run typecheck
          npm test -- --ci

      - name: Generate native Android project (expo prebuild)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          mkdir -p ../dist
          cp android/app/build/outputs/apk/release/app-release.apk "../dist/SunSeaField-v${VERSION}-${GITHUB_SHA::7}.apk"
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: SunSeaField-apk
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error
