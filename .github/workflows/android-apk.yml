name: Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Backend API base URL baked into the build (can be changed later in the app's Settings)"
        required: false
        default: "http://192.168.1.10:5000/api"
  push:
    branches: ["**"]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: ${{ github.event.inputs.api_url || vars.MOBILE_API_URL || 'http://192.168.1.10:5000/api' }}
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.1.12297006 cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck & unit tests
        run: |
          npm run typecheck
          npm test -- --ci

      - name: Generate native Android project (expo prebuild)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          mkdir -p ../dist
          NAME="SunSeaField-v${VERSION}-${GITHUB_SHA::7}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "../dist/${NAME}"
          ls -la ../dist
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: SunSeaField-apk
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-v${{ steps.apk.outputs.version }}-build.${{ github.run_number }}"
          NOTES="Sun Sea Field (sales executive app) — Android APK

          * Version: ${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          * Commit: ${GITHUB_SHA}
          * Branch: ${GITHUB_REF_NAME}
          * Default API URL baked in: \`${EXPO_PUBLIC_API_URL}\` (change it from *Server settings* on the login screen)

          Install: download the APK on the phone, allow installs from unknown sources, open it. The app needs the backend extension applied on the ERP server (see backend-extension/README.md)."
          gh release create "$TAG" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Sun Sea Field APK v${{ steps.apk.outputs.version }} (build ${{ github.run_number }})" \
            --notes "$NOTES"
          echo "Released $TAG" >> "$GITHUB_STEP_SUMMARY"
