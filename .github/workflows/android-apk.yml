name: Android APK

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app to build"
        type: choice
        options:
          - collection-agent
          - insights
          - both
        default: both
      api_url:
        description: "EXPO_PUBLIC_API_URL baked into the APK"
        type: string
        default: "https://sunseaerp-production.up.railway.app/api"
      profile:
        description: "Build profile"
        type: choice
        options:
          - release
          - debug
        default: release
  push:
    branches:
      - "claude/**"
      - main
    paths:
      - "apps/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  compute-matrix:
    name: Compute build matrix
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.set.outputs.apps }}
    steps:
      - name: Decide which app(s) to build
        id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ inputs.app }}" in
              collection-agent) apps='["collection-agent"]' ;;
              insights) apps='["insights"]' ;;
              *) apps='["collection-agent","insights"]' ;;
            esac
          else
            apps='["collection-agent","insights"]'
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "Building: $apps"

  build:
    name: Build ${{ matrix.app }}
    needs: compute-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: android-apk-${{ matrix.app }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.compute-matrix.outputs.apps) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    env:
      APP_DIR: apps/${{ matrix.app }}
      PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'release' }}
      API_URL: ${{ (github.event_name == 'workflow_dispatch' && inputs.api_url) || vars.EXPO_PUBLIC_API_URL || 'https://sunseaerp-production.up.railway.app/api' }}
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
      # Real phones only (skips x86/x86_64 emulator ABIs) — roughly halves native build time.
      ORG_GRADLE_PROJECT_reactNativeArchitectures: "arm64-v8a,armeabi-v7a"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Expo SDK 57 / React Native 0.86 defaults: compileSdk/targetSdk 36,
          # build-tools 36.0.0, NDK 27.1.x, minSdk 24 (cmake needed by native modules).
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Write .env
        run: |
          echo "EXPO_PUBLIC_API_URL=${API_URL}" > .env
          cat .env

      - name: Stamp Android versionCode from the run number
        run: |
          node -e "
            const fs = require('fs');
            const f = 'app.json';
            const j = JSON.parse(fs.readFileSync(f, 'utf8'));
            j.expo.android = j.expo.android || {};
            j.expo.android.versionCode = ${{ github.run_number }};
            fs.writeFileSync(f, JSON.stringify(j, null, 2) + '\n');
            console.log('versionCode', j.expo.android.versionCode);
          "

      - name: Generate native Android project (expo prebuild)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Configure signing
        id: signing
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$HAS_KEYSTORE" = "true" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
            {
              echo "RELEASE_STORE_FILE=release.keystore"
              echo "RELEASE_STORE_PASSWORD=${KEYSTORE_PASSWORD}"
              echo "RELEASE_KEY_ALIAS=${KEY_ALIAS}"
              echo "RELEASE_KEY_PASSWORD=${KEY_PASSWORD}"
            } >> android/gradle.properties
            echo "mode=real-keystore" >> "$GITHUB_OUTPUT"
            echo "Using ANDROID_KEYSTORE_BASE64 secret for signing."
          else
            keytool -genkeypair -v \
              -storetype PKCS12 \
              -keystore android/app/release.keystore \
              -alias ephemeral \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass ephemeral123 -keypass ephemeral123 \
              -dname "CN=SunSea CI, OU=CI, O=SunSea, L=Unknown, ST=Unknown, C=US"
            {
              echo "RELEASE_STORE_FILE=release.keystore"
              echo "RELEASE_STORE_PASSWORD=ephemeral123"
              echo "RELEASE_KEY_ALIAS=ephemeral"
              echo "RELEASE_KEY_PASSWORD=ephemeral123"
            } >> android/gradle.properties
            echo "mode=ephemeral" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret configured. This APK is signed with a throwaway keystore generated fresh for this run. A later run will use a DIFFERENT throwaway key, so Android will refuse to install it as an update over this one. Set the ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD secrets to sign with a stable key."
          fi

      - name: Wire release signingConfig in build.gradle
        run: node "${GITHUB_WORKSPACE}/.github/workflows/scripts/patch-android-signing.js"

      - name: Inject Google Maps API key (if configured)
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          # The secrets context is not available in step `if:`; guard in the shell instead.
          if [ -z "${GOOGLE_MAPS_API_KEY:-}" ]; then
            echo "::notice::GOOGLE_MAPS_API_KEY secret not set; Android map tiles will be blank until it is configured."
            exit 0
          fi
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ]; then
            sed -i "s#</application>#    <meta-data android:name=\"com.google.android.geo.API_KEY\" android:value=\"${GOOGLE_MAPS_API_KEY}\"/>\n</application>#" "$MANIFEST"
            echo "Injected com.google.android.geo.API_KEY into $MANIFEST"
          else
            echo "::warning::AndroidManifest.xml not found at $MANIFEST, skipping Google Maps key injection."
          fi

      - name: Build APK (${{ env.PROFILE }})
        working-directory: apps/${{ matrix.app }}/android
        run: |
          if [ "${PROFILE}" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: Read app metadata and rename APK
        id: meta
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./app.json').expo.version")
          VERSION_CODE=$(node -p "require('./app.json').expo.android.versionCode")
          PACKAGE=$(node -p "require('./app.json').expo.android.package")
          DISPLAY_NAME=$(node -p "require('./app.json').expo.name.replace(/[^A-Za-z0-9]/g, '')")
          SHA_SHORT="${GITHUB_SHA::7}"

          mkdir -p dist
          SRC="android/app/build/outputs/apk/${PROFILE}/app-${PROFILE}.apk"
          OUT="dist/${DISPLAY_NAME}-v${VERSION}-${SHA_SHORT}.apk"
          cp "$SRC" "$OUT"
          ls -la dist

          {
            echo "version=${VERSION}"
            echo "version_code=${VERSION_CODE}"
            echo "package=${PACKAGE}"
            echo "display_name=${DISPLAY_NAME}"
            echo "sha_short=${SHA_SHORT}"
            echo "apk_path=${OUT}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ env.PROFILE }}-apk-${{ steps.meta.outputs.sha_short }}
          path: ${{ env.APP_DIR }}/dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ env.PROFILE == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ matrix.app }}-v${{ steps.meta.outputs.version }}-build.${{ github.run_number }}"
          NOTES="${{ steps.meta.outputs.display_name }} — Android APK

          * App: ${{ matrix.app }} (\`${{ steps.meta.outputs.package }}\`)
          * Version: ${{ steps.meta.outputs.version }} (versionCode ${{ steps.meta.outputs.version_code }}, build ${{ github.run_number }})
          * Commit: ${GITHUB_SHA}
          * Branch: ${GITHUB_REF_NAME}
          * Signing: ${{ steps.signing.outputs.mode == 'real-keystore' && 'stable keystore (ANDROID_KEYSTORE_BASE64 secret)' || 'EPHEMERAL throwaway keystore — will NOT install as an update over a differently-signed build' }}
          * EXPO_PUBLIC_API_URL baked in: \`${{ env.API_URL }}\`

          Install: download the APK on the phone, allow installs from unknown sources, open it."
          gh release create "$TAG" "${{ steps.meta.outputs.apk_path }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.meta.outputs.display_name }} APK v${{ steps.meta.outputs.version }} (build ${{ github.run_number }})" \
            --notes "$NOTES"

      - name: Job summary
        run: |
          {
            echo "## ${{ matrix.app }} (${{ env.PROFILE }})"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Artifact | \`${{ matrix.app }}-${{ env.PROFILE }}-apk-${{ steps.meta.outputs.sha_short }}\` |"
            echo "| Package ID | \`${{ steps.meta.outputs.package }}\` |"
            echo "| Version / versionCode | \`${{ steps.meta.outputs.version }}\` / \`${{ steps.meta.outputs.version_code }}\` |"
            echo "| Signing | ${{ steps.signing.outputs.mode == 'real-keystore' && 'stable keystore (ANDROID_KEYSTORE_BASE64 secret)' || '**ephemeral throwaway keystore** (set ANDROID_KEYSTORE_BASE64 for a stable key)' }} |"
            echo "| EXPO_PUBLIC_API_URL | \`${{ env.API_URL }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            if [ "${PROFILE}" = "release" ]; then
              echo "| GitHub Release | \`apk-${{ matrix.app }}-v${{ steps.meta.outputs.version }}-build.${{ github.run_number }}\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
